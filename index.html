<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hop Lane</title>
  </head>
  <body>
    <div id="app">
      <div id="hud" aria-live="polite">
        <div>
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Best</span>
          <strong id="best">0</strong>
        </div>
      </div>
      <form id="answer-panel" autocomplete="off">
        <label id="answer-label" for="answer-input">Solve to unlock</label>
        <div id="question-text">Ready?</div>
        <div class="answer-row">
          <input id="answer-input" type="text" inputmode="decimal" aria-label="Math answer" />
          <button type="submit">OK</button>
        </div>
        <div id="answer-feedback" aria-live="polite">Answer, then press Space.</div>
      </form>
      <canvas id="game-canvas" tabindex="0" aria-label="3D road crossing game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
